[package]
name = "mc-block-color"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
description = "A lib for finding minecraft block color."
repository.workspace = true
license.workspace = true

[dependencies]
palette = "0.7"

[build-dependencies]
quote = "1.0"
futures = "0.3"
image = "0.25"
palette = "0.7"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC" }
tokio = { version = "1.52", features = ["full"] }
